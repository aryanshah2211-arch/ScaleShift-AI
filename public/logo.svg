      <stop offset="0%" stopColor="#008C7E" />
      <stop offset="100%" stopColor="#00A896" />
    </linearGradient>
    <linearGradient id="logo-navy" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0B1F33" />
      <stop offset="100%" stopColor="#102A43" />
    </linearGradient>
  </defs>

  <!-- Icon Mark -->
  <g transform="translate(6, 4)">
    <!-- Top-Right Teal Arrowhead -->
    <path d="M 44 10 H 76 V 42 H 64 V 22 H 44 Z" fill="url(#logo-teal)" />

    <!-- Teal Upper Ribbon -->
    <path d="M 44 10 L 24 30 L 32 38 L 18 52 L 8 62 L 8 54 L 18 44 L 28 54 L 38 44 L 30 36 L 46 20 L 44 10 Z" fill="url(#logo-teal)" />
