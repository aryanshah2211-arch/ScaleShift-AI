  <!-- Typography -->
  <text x="96" y="46" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="32" fill="#102A43" letter-spacing="-0.025em">ScaleShift AI</text>
  <text x="98" y="68" font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10.5" fill="#102A43" opacity="0.85" letter-spacing="0.22em">AI-DRIVEN SOLUTIONS</text>
</svg>
