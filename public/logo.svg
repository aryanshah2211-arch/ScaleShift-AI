    <path d="M 38 45 L 45 52 L 36 61 L 29 54 Z" fill="url(#logo-navy)" />

    <!-- Outer Navy Base & Flank -->
    <path d="M 18 80 L 10 72 L 20 62 L 27 69 L 39 57 L 47 65 L 60 52 L 60 62 L 74 48 L 74 38 L 81 38 L 81 54 L 66 69 L 52 69 L 42 79 L 28 79 L 18 80 Z" fill="url(#logo-navy)" />
