<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (blurred modern office atmosphere) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#435058" />
      <stop offset="40%" stopColor="#2E383F" />
      <stop offset="100%" stopColor="#1B2228" />
    </linearGradient>

    <!-- Warm office bokeh lights -->
    <radialGradient id="bokeh-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFD39B" stop-opacity="0.45" />
      <stop offset="100%" stopColor="#FFD39B" stop-opacity="0" />
    </radialGradient>

    <!-- Foliage green bokeh -->
    <radialGradient id="bokeh-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#4E785E" stop-opacity="0.5" />
      <stop offset="100%" stopColor="#4E785E" stop-opacity="0" />
    </radialGradient>

    <!-- Skin Highlights & Shadows -->
    <linearGradient id="skin-face" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#E2A684" />
      <stop offset="50%" stopColor="#CF8E68" />
      <stop offset="100%" stopColor="#B3714A" />
    </linearGradient>

    <!-- Pastel Pink Oxford Button-down -->
    <linearGradient id="shirt-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5BCC7" />
      <stop offset="50%" stopColor="#ECAAB7" />
      <stop offset="100%" stopColor="#DA91A0" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hair-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#352B27" />
      <stop offset="70%" stopColor="#1C1614" />
      <stop offset="100%" stopColor="#0D0A09" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)" />

  <!-- Soft modern office background elements / bokeh -->
  <rect x="70" y="0" width="30" height="240" fill="#252F36" opacity="0.7" />
  <rect x="290" y="0" width="25" height="240" fill="#252F36" opacity="0.7" />
  <circle cx="80" cy="80" r="70" fill="url(#bokeh-warm)" />
  <circle cx="360" cy="110" r="60" fill="url(#bokeh-warm)" />
  <circle cx="50" cy="270" r="85" fill="url(#bokeh-green)" />
  <circle cx="340" cy="260" r="75" fill="url(#bokeh-green)" />

  <!-- Torso & Shoulders: Pastel Pink Oxford Shirt -->
  <path d="M 50 400 C 65 310 110 268 150 255 L 180 270 L 200 276 L 220 270 L 250 255 C 290 268 335 310 350 400 Z" fill="url(#shirt-pink)" />
  
  <!-- Subtle shirt texture & folds -->
  <path d="M 120 310 Q 150 350 160 400" stroke="#DA91A0" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 280 310 Q 250 350 240 400" stroke="#DA91A0" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  <path d="M 260 380 Q 285 385 315 400" stroke="#C97F8F" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

  <!-- Center Placket & Mother-of-Pearl Buttons -->
  <path d="M 194 285 L 206 285 L 206 400 L 194 400 Z" fill="#F7C4CE" />
  <line x1="194" y1="285" x2="194" y2="400" stroke="#D38C9B" stroke-width="1.5" />
  <line x1="206" y1="285" x2="206" y2="400" stroke="#D38C9B" stroke-width="1.5" />

  <!-- Buttons -->
  <circle cx="200" cy="315" r="4.5" fill="#FFFFFF" stroke="#D38C9B" stroke-width="1" />
  <circle cx="200" cy="355" r="4.5" fill="#FFFFFF" stroke="#D38C9B" stroke-width="1" />
  <circle cx="200" cy="395" r="4.5" fill="#FFFFFF" stroke="#D38C9B" stroke-width="1" />

  <!-- Left Collar Leaf with Button -->
  <path d="M 152 254 L 192 284 L 182 305 L 140 272 Z" fill="#FAD1DA" stroke="#D892A2" stroke-width="1.5" />
  <circle cx="152" cy="274" r="2" fill="#FFFFFF" />

  <!-- Right Collar Leaf with Button -->
  <path d="M 248 254 L 208 284 L 218 305 L 260 272 Z" fill="#FAD1DA" stroke="#D892A2" stroke-width="1.5" />
  <circle cx="248" cy="274" r="2" fill="#FFFFFF" />

  <!-- Neck -->
  <path d="M 172 200 L 172 265 C 185 272 215 272 228 265 L 228 200 Z" fill="#B3714A" />
  <path d="M 176 215 C 188 245 212 245 224 215 Z" fill="#9E5F3B" opacity="0.45" />

  <!-- Head Base -->
  <ellipse cx="200" cy="165" rx="58" ry="70" fill="url(#skin-face)" />

  <!-- Ears -->
  <path d="M 143 160 C 137 150 137 178 144 185 Z" fill="#CF8E68" />
  <path d="M 257 160 C 263 150 263 178 256 185 Z" fill="#CF8E68" />

  <!-- Jawline & Chin Definition -->
  <path d="M 152 170 C 158 222 180 236 200 236 C 220 236 242 222 248 170 Z" fill="url(#skin-face)" />

  <!-- Eyebrows (Defined, natural arch) -->
  <path d="M 162 142 Q 176 136 188 143" stroke="#251E1A" stroke-width="4.2" stroke-linecap="round" />
  <path d="M 212 143 Q 224 136 238 142" stroke="#251E1A" stroke-width="4.2" stroke-linecap="round" />

  <!-- Eyes (Warm brown, attentive) -->
  <ellipse cx="175" cy="154" rx="7.5" ry="5.5" fill="#FFFFFF" />
  <ellipse cx="225" cy="154" rx="7.5" ry="5.5" fill="#FFFFFF" />
  
  <!-- Irises & Pupils -->
  <circle cx="176" cy="154" r="4.5" fill="#3B261A" />
  <circle cx="176" cy="154" r="2.2" fill="#120B07" />
  <circle cx="178" cy="152" r="1.5" fill="#FFFFFF" />

  <circle cx="224" cy="154" r="4.5" fill="#3B261A" />
  <circle cx="224" cy="154" r="2.2" fill="#120B07" />
  <circle cx="226" cy="152" r="1.5" fill="#FFFFFF" />

  <!-- Eyelid lines -->
  <path d="M 166 150 Q 175 146 184 150" stroke="#70442D" stroke-width="1.5" fill="none" />
  <path d="M 216 150 Q 225 146 234 150" stroke="#70442D" stroke-width="1.5" fill="none" />

  <!-- Nose -->
  <path d="M 200 150 L 197 182 L 205 182" stroke="#8F5435" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 191 182 Q 200 187 209 182" stroke="#8F5435" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- Smile: Open, friendly with white teeth -->
  <path d="M 180 198 Q 200 216 220 198 Q 200 203 180 198 Z" fill="#6E2C1D" />
  <path d="M 183 199 Q 200 209 217 199 Q 200 202 183 199 Z" fill="#FFFFFF" />
  <path d="M 178 198 Q 200 220 222 198" stroke="#5E2215" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Natural stubble / lower shadow subtle -->
  <path d="M 186 222 Q 200 228 214 222" stroke="#8A5134" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Hair: Thick, dark, combed slightly to the right with volume -->
  <path d="M 140 145 C 137 90 162 70 200 70 C 245 70 266 90 262 145 C 262 145 252 118 238 116 C 220 114 195 106 172 114 C 155 120 144 135 140 145 Z" fill="url(#hair-shade)" />
  <path d="M 148 115 C 160 88 195 82 225 86 C 248 90 258 102 260 115 C 255 102 242 92 220 88 C 190 84 165 96 148 115 Z" fill="#42352F" />
  <path d="M 140 145 C 135 120 148 95 170 82" stroke="#251E1A" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 180 84 Q 215 84 245 105" stroke="#3A2E28" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
